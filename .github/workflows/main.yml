name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Build and lint (syntax check)
        run: |
          python -m py_compile app.py
          flake8 app.py tests --max-line-length=100

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:ci python -m pytest -q
